# ============================================================================
# CAD PARAMETER MAP.
#
# Left side: the parameter name in the CAD model's expression / design table.
# Right side: the state variable it comes from.
#
# run.py writes out/cad_dims.csv in millimetres. Point your CAD design table at
# that file and the model rebuilds when the code changes. Nobody retypes a
# dimension, and nobody works from a screenshot of somebody's spreadsheet.
#
# Keep CAD-side names in CAD conventions and physics-side names in physics
# conventions. This file is the translation layer, and it is the only place the
# two vocabularies meet.
# ============================================================================

