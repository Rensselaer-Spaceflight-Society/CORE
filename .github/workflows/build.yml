name: Software CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --junitxml=out/tests.xml
      - run: python scripts/generate_dependencies.py --check
      - name: Generate preliminary engineering report
        run: python run.py --report-only
      - name: Show engineering blockers
        run: python scripts/ci_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preliminary-report-${{ matrix.os }}-${{ matrix.python }}
          path: out/
          retention-days: 30
