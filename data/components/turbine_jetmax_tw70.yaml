title: JETMAX 70 mm cast axial turbine wheel, finished and prebalanced (alternative)
make_buy: buy
budget_rows: [R02]
software_owner: core/turbine_rating.py
summary: >
  Alternative matched-pair candidate. The UT160 plan engine (designer Ulrich Thiel)
  uses this wheel with the JETMAX 70 mm finished NGV and a Garrett 179-24 70 mm
  compressor wheel; its designer reports 140-180 N at 123,000 rpm. That is evidence
  that the pair works in that engine, not in CORE.
