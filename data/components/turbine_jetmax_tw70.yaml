    sha256: 39448e60e92832f344127cdc9e806f22144b7901af06e0812b43266a1ea5b99b
  - id: jetmax-turbine-wheels-page
    kind: supplier_listing
    url: https://www.jetmax.ch/en/turbine_wheels.htm
    accessed: 2026-10-04
    note: 70 mm finished CHF 280 / EUR 235; thrust class 140-180 N.
  - id: ut160-plan-page
    kind: designer_statement
    url: https://ut160.de.tl/Bauplan-s-building-guidance.htm
    accessed: 2026-10-04
    note: "Designer states 140-180 N at 123,000 rpm depending on build; mixture lubrication with kerosene + 5 % turbine oil."
